trigger:
  branches:
    include:
      - feature/*

pool: Agents_pool

stages:
  - stage: terraforminstall
    displayName: terraform install
    jobs:
      - job: terraforminstall
        displayName: terraform install
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'

  - stage: terraforminitvalidateplan
    displayName: terraform init validate plan
    jobs:
      - job: terraforminitvalidateplan
        displayName: terraform init validate plan
        steps:
        - task: TerraformTask@5
          displayName: terraform init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            backendServiceArm: 'connection_ado'
            backendAzureRmStorageAccountName: 'yuvrajstg'
            backendAzureRmContainerName: 'yuvicntr'
            backendAzureRmKey: 'backend.tfstate'

        - task: TerraformTask@5
          displayName: terraform validate
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'

        - task: TerraformTask@5
          displayName: terraform plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'connection_ado'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            environmentServiceNameAzureRM: 'connection_ado'
