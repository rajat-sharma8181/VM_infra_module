trigger: 
  branches:
    include:
      - main
      - feature/*

pool: Agents_pool

stages: 
  - stage: Build
    jobs:
      - job: terraforminitvalidateplan
        # displayName: terraform install init validate plan job
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'

        - task: TerraformTask@5
          displayName: terraform init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            backendServiceArm: 'connection_ado'
            backendAzureRmStorageAccountName: 'yuvrajstg'
            backendAzureRmContainerName: 'yuvicntr'
            backendAzureRmKey: '$(backendtf)'

        - task: TerraformTask@5
          displayName: terraform validate
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'

  - stage: Scaning
    # displayName: Scaning Stage
    jobs:
      - job: Sacning
        steps:
        - task: tfsec@1
          inputs:
            version: 'v1.26.0'

        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              cd $(System.DefaultWorkingDirectory)/environment
              tflint --recursive

        - task: TerraformTask@5
          displayName: terraform plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'connection_ado'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'




  
