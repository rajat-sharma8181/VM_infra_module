trigger: none
  # branches:
  #   include:
  #     - main
  #     - feature/*

pool: Agents_pool

variables:
-  name: workingdir
   value: $(System.DefaultWorkingDirectory)/environment/${{parameters.environment}}

parameters:
  - name: environment
    type: string
    default: dev
    values:
      - dev
      - prod

stages: 
  - stage: Scanning
    displayName: Scanning Stage
    jobs:
      - job: Scanningjob
        displayName: Scanning job
        steps:
        - template: template/tfsec.yaml
          
        - template: template/tflint.yaml

  - stage: infraprovision
    dependsOn: Scanning
    condition: succeeded()
    jobs:
      - job: terraforminitvalidateplan
        displayName: terraform install init validate plan job
        steps:
        - task: TerraformInstaller@1
          displayName: terraform install
          inputs:
            terraformVersion: 'latest'

        - template: tamplate/init.yaml

        - task: TerraformTask@5
          displayName: terraform validate
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: $(workingdir)

        - task: TerraformTask@5
          displayName: plan job
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: $(workingdir)
            environmentServiceNameAzureRM: 'infra-service1'

