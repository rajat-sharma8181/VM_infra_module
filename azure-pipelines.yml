############################################

  - stage: infracost
    displayName: infracost stage
    jobs:
      - job: infracost
        displayName: infracost job
        steps:
        - template: template/init.yaml

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'infra_service1'
            workingDirectory: '$(workingdir)'

        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              infracost auth login
              infracost breakdown --path tfplan --format table
            workingDirectory: '$(workingdir)'

