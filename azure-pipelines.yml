trigger: none
  # branches:
  #   include:
  #     - main
  #     - feature/*

pool: Agents_pool

variables:
-  name: workingdir
   value: $(System.DefaultWorkingDirectory)/environment/dev

parameters:
  - name: environment
    type: string
    default: dev
    values:
      - dev
      - prod

############################################

stages: 
  - stage: Scanning
    displayName: Scanning Stage
    jobs:
      - job: tfsec
        displayName: tfsec job
        steps:
        - template: template/tfsec.yaml

      - job: tflint
        displayName: tflint job
        dependsOn: tfsec
        steps:
        - template: template/tflint.yaml

      - job: checkov
        displayName: checkov job
        dependsOn: tflint
        continueOnError: true
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'checkov -d .'
            workingDirectory: $(workingdir)

